<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$LAYOUT_TITLE | $CONTENT_TITLE">Hotel Reservation System</title>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon"/>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/chat.css}">

    <!-- Page specific CSS -->
    <th:block layout:fragment="css"></th:block>
</head>
<body>
<!-- Header -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- Main Content -->
<main>
    <th:block layout:fragment="content"></th:block>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- Chat Interface -->
<div id="chat-fab" class="chat-fab">
    <i class="fas fa-comments"></i>
</div>

<div id="chat-container" class="chat-container">
    <div class="chat-header">
        <h4>Hotel Assistant</h4>
        <button id="close-chat" class="close-chat">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div id="chat-messages" class="chat-messages">
        <!-- Messages will be added here -->
    </div>
    <div class="chat-input-container">
        <input type="text" id="chat-input" class="chat-input" placeholder="Type your message...">
        <button id="send-button" class="send-button" disabled>
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- jQuery (for some components) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Custom JS -->
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/chat.js}"></script>

<!-- Page specific JS -->
<th:block layout:fragment="js"></th:block>
</body>
</html>
