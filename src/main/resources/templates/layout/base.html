<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}" />
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}" />
    <title th:text="${pageTitle != null ? pageTitle + ' | Fast-Hotels' : 'Fast-Hotels'}">Fast-Hotels</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" 
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
          integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <!-- Chat CSS -->
    <link rel="stylesheet" th:href="@{/css/chat.css}">
    <!-- Additional CSS -->
    <th:block layout:fragment="cssResources"></th:block>
</head>

<body>
    <!-- Header -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- Main Content -->
    <main>
        <div layout:fragment="content"></div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Toast Container for Notifications -->
    <div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050;"></div>

    <!-- Chat FAB -->
    <button id="chat-fab" aria-label="Open chat">
        <i class="fas fa-comments"></i>
    </button>

    <!-- Chat Container -->
    <div id="chat-container">
        <div class="chat-header">
            <h3>Hotel Assistant</h3>
            <button id="close-chat" aria-label="Close chat">&times;</button>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-container">
            <textarea id="chat-input" placeholder="Type your message..." rows="1"></textarea>
            <button id="send-button" disabled>
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <!-- Main JS -->
    <script th:src="@{/js/main.js}"></script>
    <!-- Chat JS -->
    <script th:src="@{/js/chat.js}"></script>
    <!-- Additional JS -->
    <th:block layout:fragment="jsResources"></th:block>
</body>

</html>
