<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Hotel Owner Dashboard</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container py-5">
        <h1 class="mb-4">Hotel Owner Dashboard</h1>

        <!-- Dashboard Summary -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <h5 class="card-title">My Hotels</h5>
                        <p class="card-text display-4" th:text="${hotelCount}">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hotel List -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">My Hotels</h5>
                <a href="/hotel-owner/hotels/create" class="btn btn-primary btn-sm">
                    <i class="fas fa-plus me-1"></i>Add New Hotel
                </a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Location</th>
                            <th>Rating</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${hotels.empty}">
                            <td colspan="4" class="text-center">No hotels found</td>
                        </tr>
                        <tr th:each="hotel : ${hotels}">
                            <td th:text="${hotel.name}">Hotel Name</td>
                            <td th:text="${hotel.city + ', ' + hotel.country}">Location</td>
                            <td>
                                        <span th:each="i : ${#numbers.sequence(1, hotel.starRating)}">
                                            <i class="fas fa-star text-warning"></i>
                                        </span>
                            </td>
                            <td>
                                <a th:href="@{'/hotel-owner/hotels/' + ${hotel.id}}" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-edit me-1"></i>Manage
                                </a>
                                <a th:href="@{'/hotels/' + ${hotel.id}}" class="btn btn-sm btn-outline-secondary" target="_blank">
                                    <i class="fas fa-eye me-1"></i>View
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
