<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/dashboard_layout}">

<head>
    <title>Hotel Owner Dashboard</title>
</head>

<body>
    <div layout:fragment="dashboard-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0 text-gray-800">Hotel Owner Dashboard</h1>
        </div>

        <!-- Dashboard Summary -->
        <div class="row mb-4">
            <div class="col-xl-3 col-md-6 mb-4">
                <div class="card border-left-primary shadow h-100 py-2">
                    <div class="card-body">
                        <div class="row no-gutters align-items-center">
                            <div class="col mr-2">
                                <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">My Hotels</div>
                                <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${hotelCount}">0</div>
                            </div>
                            <div class="col-auto">
                                <i class="fas fa-building fa-2x text-gray-300"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hotel List -->
        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex justify-content-between align-items-center bg-white">
                <h6 class="m-0 font-weight-bold text-primary">My Hotels</h6>
                <a href="/hotel-owner/hotels/create" class="btn btn-primary btn-sm shadow-sm">
                    <i class="fas fa-plus fa-sm text-white-50 me-1"></i> Add New Hotel
                </a>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th scope="col" class="px-4">Name</th>
                                <th scope="col">Location</th>
                                <th scope="col">Rating</th>
                                <th scope="col" class="text-end px-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${hotels.empty}">
                                <td colspan="4" class="text-center py-5">
                                    <i class="fas fa-hotel fa-3x text-gray-200 mb-3"></i>
                                    <p class="text-muted">No hotels found. Start by adding your first hotel!</p>
                                </td>
                            </tr>
                            <tr th:each="hotel : ${hotels}">
                                <td class="px-4 font-weight-bold text-dark" th:text="${hotel.name}">Hotel Name</td>
                                <td th:text="${hotel.city + ', ' + hotel.country}">Location</td>
                                <td>
                                    <span class="text-warning">
                                        <i class="fas fa-star"
                                            th:each="i : ${#numbers.sequence(1, hotel.starRating ?: 0)}"></i>
                                        <i class="far fa-star"
                                            th:each="i : ${#numbers.sequence((hotel.starRating ?: 0) + 1, 5)}"
                                            th:if="${(hotel.starRating ?: 0) < 5}"></i>
                                    </span>
                                </td>
                                <td class="text-end px-4">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{'/hotel-owner/hotels/' + ${hotel.id}}"
                                            class="btn btn-outline-primary" title="Manage">
                                            <i class="fas fa-cog"></i>
                                        </a>
                                        <a th:href="@{'/hotels/' + ${hotel.id}}" class="btn btn-outline-secondary"
                                            target="_blank" title="View Public Page">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
