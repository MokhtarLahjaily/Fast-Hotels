<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>My Favorite Hotels</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container my-5">
        <h1 class="mb-4">My Favorite Hotels</h1>

        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}">Error message</span>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" role="alert">
            <span th:text="${successMessage}">Success message</span>
        </div>

        <div th:if="${favorites != null and !favorites.empty}" class="row">
            <div th:each="hotel : ${favorites}" class="col-md-6 col-lg-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <img th:if="${hotel.imageUrl != null}" th:src="${hotel.imageUrl}" class="card-img-top" alt="Hotel Image" style="height: 200px; object-fit: cover;">
                    <img th:unless="${hotel.imageUrl != null}" src="/images/hotel-placeholder.jpg" class="card-img-top" alt="Hotel Image" style="height: 200px; object-fit: cover;">

                    <div class="card-body">
                        <h5 class="card-title" th:text="${hotel.name}">Hotel Name</h5>
                        <p class="card-text">
                            <i class="bi bi-geo-alt-fill"></i>
                            <span th:text="${hotel.city + ', ' + hotel.country}">Location</span>
                        </p>
                        <div class="mb-2">
                                <span th:each="i : ${#numbers.sequence(1, hotel.starRating)}">
                                    <i class="bi bi-star-fill text-warning"></i>
                                </span>
                        </div>
                        <p class="card-text" th:text="${#strings.abbreviate(hotel.description, 100)}">Description</p>
                        <p class="card-text">
                            <strong>From $<span th:text="${hotel.minPrice}">100</span> per night</strong>
                        </p>
                    </div>

                    <div class="card-footer d-flex justify-content-between align-items-center">
                        <a th:href="@{'/hotels/' + ${hotel.id}}" class="btn btn-primary">View Details</a>

                        <form th:action="@{'/favorites/remove/' + ${hotel.id}}" method="post">
                            <input type="hidden" name="redirectUrl" value="/favorites">
                            <button type="submit" class="btn btn-outline-danger">
                                <i class="bi bi-heart-fill"></i> Remove
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${favorites == null or favorites.empty}" class="text-center my-5">
            <div class="mb-4">
                <i class="bi bi-heart" style="font-size: 4rem;"></i>
            </div>
            <h3>You don't have any favorite hotels yet</h3>
            <p class="text-muted">Browse our hotels and add some to your favorites!</p>
            <a href="/hotels" class="btn btn-primary mt-3">Browse Hotels</a>
        </div>
    </div>
</div>
</body>
</html>
