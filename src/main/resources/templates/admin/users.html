<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <title>User Management</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container py-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>User Management</h1>
                <a href="/admin/users/create" class="btn btn-primary">
                    <i class="fas fa-plus me-1"></i> Add New User
                </a>
            </div>

            <!-- Alerts -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}">Success message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}">Error message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Search and Filter -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <form action="/admin/users" method="get" class="row g-3">
                        <div class="col-md-4">
                            <label for="search" class="form-label">Search</label>
                            <input type="text" class="form-control" id="search" name="search" th:value="${param.search}"
                                placeholder="Name or email">
                        </div>
                        <div class="col-md-3">
                            <label for="role" class="form-label">Role</label>
                            <select class="form-select" id="role" name="role">
                                <option value="">All Roles</option>
                                <option th:selected="${param.role != null && param.role[0] == 'CUSTOMER'}"
                                    value="CUSTOMER">Customer</option>
                                <option th:selected="${param.role != null && param.role[0] == 'ADMIN'}" value="ADMIN">
                                    Admin</option>
                                <option th:selected="${param.role != null && param.role[0] == 'HOTEL_OWNER'}"
                                    value="HOTEL_OWNER">Hotel Owner</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status">
                                <option value="">All Statuses</option>
                                <option th:selected="${param.status != null && param.status[0] == 'ACTIVE'}"
                                    value="ACTIVE">Active</option>
                                <option th:selected="${param.status != null && param.status[0] == 'INACTIVE'}"
                                    value="INACTIVE">Inactive</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-search me-1"></i> Search
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Users Table -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Name</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Role</th>
                                    <th scope="col">Phone</th>
                                    <th scope="col">Joined</th>
                                    <th scope="col">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${users == null || users.empty}">
                                    <td colspan="7" class="text-center py-4">
                                        <i class="fas fa-users fa-3x text-muted mb-3"></i>
                                        <p class="text-muted">No users found</p>
                                    </td>
                                </tr>
                                <tr th:each="user : ${users}" th:if="${users != null && !users.empty}">
                                    <td th:text="${user.id}">1</td>
                                    <td th:text="${(user.firstName ?: '') + ' ' + (user.lastName ?: '')}">John Doe</td>
                                    <td th:text="${user.email ?: 'N/A'}">john@example.com</td>
                                    <td>
                                        <span class="badge bg-primary"
                                            th:if="${user.role == 'CUSTOMER'}">Customer</span>
                                        <span class="badge bg-danger" th:if="${user.role == 'ADMIN'}">Admin</span>
                                        <span class="badge bg-success" th:if="${user.role == 'HOTEL_OWNER'}">Hotel
                                            Owner</span>
                                        <span class="badge bg-secondary"
                                            th:unless="${user.role == 'CUSTOMER' || user.role == 'ADMIN' || user.role == 'HOTEL_OWNER'}"
                                            th:text="${user.role}">Unknown</span>
                                    </td>
                                    <td th:text="${user.phone ?: 'N/A'}">+1234567890</td>
                                    <td
                                        th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy-MM-dd') : 'N/A'}">
                                        2023-01-15</td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-info">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <a th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                                                class="btn btn-primary">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <button type="button" class="btn btn-danger"
                                                th:disabled="${user.role == 'ADMIN'}" data-bs-toggle="modal"
                                                th:data-bs-target="'#deleteModal' + ${user.id}">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav th:if="${users != null && users.totalPages > 1}" aria-label="Page navigation">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${users.first ? 'disabled' : ''}">
                                <a class="page-link"
                                    th:href="@{/admin/users(page=${users.number - 1}, size=${users.size}, search=${param.search}, role=${param.role}, status=${param.status})}"
                                    tabindex="-1" th:aria-disabled="${users.first}">Previous</a>
                            </li>

                            <li class="page-item" th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                                th:classappend="${i == users.number ? 'active' : ''}">
                                <a class="page-link"
                                    th:href="@{/admin/users(page=${i}, size=${users.size}, search=${param.search}, role=${param.role}, status=${param.status})}"
                                    th:text="${i + 1}">1</a>
                            </li>

                            <li class="page-item" th:classappend="${users.last ? 'disabled' : ''}">
                                <a class="page-link"
                                    th:href="@{/admin/users(page=${users.number + 1}, size=${users.size}, search=${param.search}, role=${param.role}, status=${param.status})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
