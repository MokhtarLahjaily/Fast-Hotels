<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <title>Login</title>
</head>

<body>
    <main layout:fragment="content">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <h2 class="text-center mb-4">Login</h2>

                            <!-- Alert for error messages -->
                            <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}">
                                Invalid email or password
                            </div>

                            <!-- Login Form -->
                            <form th:action="@{/login}" method="post" th:object="${loginRequest}">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                        <input type="email" class="form-control" id="email" th:field="*{email}"
                                            required>
                                    </div>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                        th:errors="*{email}">
                                        Please enter a valid email
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                        <input type="password" class="form-control" id="password" th:field="*{password}"
                                            required>
                                    </div>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                        th:errors="*{password}">
                                        Please enter your password
                                    </div>
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Remember me</label>
                                </div>
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-sign-in-alt me-2"></i>Login
                                    </button>
                                </div>
                            </form>

                            <div class="mt-3 text-center">
                                <p>Don't have an account? <a th:href="@{/register}"
                                        class="text-decoration-none">Register here</a></p>
                                <p><a th:href="@{/forgot-password}" class="text-decoration-none">Forgot password?</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
