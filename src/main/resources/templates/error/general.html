<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <title>Error - EasyStay</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8 text-center">
                    <div class="error-container p-5 shadow-lg rounded-4 bg-white">
                        <div class="error-icon mb-4">
                            <i class="fas fa-exclamation-triangle fa-5x text-danger animate-bounce"></i>
                        </div>
                        <h1 class="display-4 fw-bold text-dark mb-3" th:text="${status}">Error</h1>
                        <h2 class="h4 text-muted mb-4">Oops! Something went wrong</h2>

                        <div class="alert alert-light border border-danger-subtle p-4 mb-4 text-start">
                            <h5 class="alert-heading fw-bold mb-2">Error Details:</h5>
                            <p class="mb-1"><strong>Message:</strong> <span th:text="${message}">An unexpected error
                                    occurred.</span></p>
                            <p class="mb-0 text-muted small" th:if="${exception}">
                                <strong>Tech detail:</strong> <span th:text="${exception}">Internal Error</span>
                            </p>
                        </div>

                        <div class="d-flex justify-content-center gap-3">
                            <a href="/" class="btn btn-primary btn-lg px-4 rounded-pill">
                                <i class="fas fa-home me-2"></i> Back to Home
                            </a>
                            <button onclick="window.history.back()"
                                class="btn btn-outline-secondary btn-lg px-4 rounded-pill">
                                <i class="fas fa-arrow-left me-2"></i> Go Back
                            </button>
                        </div>
                    </div>

                    <p class="mt-4 text-muted">
                        If this problem persists, please <a href="/contact" class="text-primary">contact our support
                            team</a>.
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
