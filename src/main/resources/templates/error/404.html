<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <title>404 - Page Not Found</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8 text-center">
                    <div class="error-container p-5 shadow-lg rounded-4 bg-white">
                        <div class="error-icon mb-4">
                            <i class="fas fa-map-signs fa-5x text-primary animate-bounce"></i>
                        </div>
                        <h1 class="display-1 fw-bold text-dark">404</h1>
                        <h2 class="h3 mb-4">Page Lost in Paradise?</h2>
                        <p class="lead text-muted mb-4"
                            th:text="${message ?: 'The page you are looking for does not exist or has been moved.'}">
                            The page you are looking for does not exist or has been moved.
                        </p>
                        <div class="d-flex justify-content-center gap-3">
                            <a href="/" class="btn btn-primary btn-lg px-4 rounded-pill">
                                <i class="fas fa-home me-2"></i> Take Me Home
                            </a>
                            <a href="/search" class="btn btn-outline-primary btn-lg px-4 rounded-pill">
                                <i class="fas fa-search me-2"></i> Find Hotels
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
