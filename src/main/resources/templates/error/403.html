<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <title>403 - Access Denied</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8 text-center">
                    <div class="error-container p-5 shadow-lg rounded-4 bg-white border-top border-5 border-warning">
                        <div class="error-icon mb-4">
                            <i class="fas fa-lock fa-5x text-warning"></i>
                        </div>
                        <h1 class="display-3 fw-bold text-dark">403</h1>
                        <h2 class="h3 mb-4">Access Denied</h2>
                        <p class="lead text-muted mb-4"
                            th:text="${message ?: 'You do not have permission to access this protected area.'}">
                            You do not have permission to access this protected area.
                        </p>
                        <div class="alert alert-warning border-0 small mb-4">
                            If you believe this is an error, please try logging out and logging back in.
                        </div>
                        <div class="d-flex justify-content-center gap-3">
                            <a href="/" class="btn btn-primary btn-lg px-4 rounded-pill">
                                <i class="fas fa-home me-2"></i> Home Page
                            </a>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-outline-warning btn-lg px-4 rounded-pill">
                                    <i class="fas fa-sign-out-alt me-2"></i> Re-login
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
